# Dirty Socks login + raid sign-up API (Cloudflare Worker). See worker/README.md for the 6-step setup.
name = "dirty-socks-login"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
SITE_ORIGIN = "https://www.dirtysocks.net"
REGION = "us"
# Forever profile data, same namespace the hourly guild-data job already uses.
PROFILE_NAMESPACE = "profile-forever-us"
# Blizzard account ids (the "sub" shown in the officer panel) allowed to approve sign-ups, comma separated.
OFFICER_SUBS = ""
# Extra sites allowed to call the API (for testing), comma separated.
ALLOWED_ORIGINS = ""

# Sign-ups live in a Durable Object (SQLite). It needs no setup: Cloudflare creates it on first deploy.
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]
