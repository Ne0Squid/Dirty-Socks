name: Deploy login worker

# Publishes worker/ (the Battle.net login + raid sign-up service) to Cloudflare.
# It does nothing until the Cloudflare secrets exist. Setup steps: worker/README.md
on:
  push:
    branches: [main, blizzard-login]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # optional: sign-up alerts (worker/README.md)
      DISCORD_NEWS_WEBHOOK_URL: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}   # optional: new news posts
      WEB_ADMIN_SUBS: ${{ secrets.WEB_ADMIN_SUBS }}   # optional: who may post news (kept secret)
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        id: cfg
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not set yet, so nothing was deployed. See worker/README.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test the worker
        if: steps.cfg.outputs.ready == 'true'
        run: node worker/test.mjs

      # The Discord secret is only uploaded when it exists, so deploys keep working before it is added.
      - name: Pick the secrets to upload
        id: sec
        if: steps.cfg.outputs.ready == 'true'
        run: |
          {
            echo "list<<EOF"
            echo BLIZZARD_CLIENT_ID
            echo BLIZZARD_CLIENT_SECRET
            echo SESSION_SECRET
            if [ -n "$DISCORD_WEBHOOK_URL" ]; then echo DISCORD_WEBHOOK_URL; fi
            if [ -n "$DISCORD_NEWS_WEBHOOK_URL" ]; then echo DISCORD_NEWS_WEBHOOK_URL; fi
            if [ -n "$WEB_ADMIN_SUBS" ]; then echo WEB_ADMIN_SUBS; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        if: steps.cfg.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: ${{ steps.sec.outputs.list }}
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_NEWS_WEBHOOK_URL: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}
          WEB_ADMIN_SUBS: ${{ secrets.WEB_ADMIN_SUBS }}

      # Running the workflow by hand (Actions -> Deploy login worker -> Run workflow) also posts one test message.
      - name: Send a test message to Discord
        if: github.event_name == 'workflow_dispatch' && steps.cfg.outputs.ready == 'true' && env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -fsS -H "Content-Type: application/json" \
            -d '{"username":"Dirty Socks Sign-ups","content":"✅ Sign-up alerts are connected. New raid sign-ups will show up in this channel."}' \
            "$DISCORD_WEBHOOK_URL"

      - name: Send a test message to the news channel
        if: github.event_name == 'workflow_dispatch' && steps.cfg.outputs.ready == 'true' && env.DISCORD_NEWS_WEBHOOK_URL != ''
        run: |
          curl -fsS -H "Content-Type: application/json" \
            -d '{"username":"Dirty Socks News","content":"✅ News alerts are connected. New posts from the website will show up in this channel."}' \
            "$DISCORD_NEWS_WEBHOOK_URL"
