name: Update item stats

on:
  schedule:
    - cron: "17 9 * * *"   # daily; only does real work when the game build changes
  workflow_dispatch:
    inputs:
      force:
        description: "Re-fetch everything even if the build is unchanged"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-item-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch item stats
        run: node scripts/fetch-item-stats.mjs
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add item-stats.json
          git diff --cached --quiet || (git commit -m "Update item stats" && git pull --rebase origin main && git push)
