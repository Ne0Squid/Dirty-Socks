name: Update guild data

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write

# Never let two runs overlap
concurrency:
  group: update-guild-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch guild data from Blizzard
        run: node fetch-guild-data.mjs
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guild-data.json
          git diff --cached --quiet || (git commit -m "Update guild data" && git pull --rebase origin main && git push)
