name: Test item sites (temporary)
on:
  push:
    branches: [dungeon-loot]
    paths: ["scripts/test-sites.mjs", ".github/workflows/test-sites.yml"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/test-sites.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites-test.json
          git commit -m "Site test results" && git pull --rebase origin dungeon-loot && git push
