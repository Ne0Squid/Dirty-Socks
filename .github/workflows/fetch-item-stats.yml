name: Fetch item stats (temporary)
on:
  push:
    branches: [dungeon-loot]
    paths: ["scripts/fetch-item-stats.mjs", ".github/workflows/fetch-item-stats.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-item-stats.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add item-stats.json
          git commit -m "Item stats" && git pull --rebase origin dungeon-loot && git push
