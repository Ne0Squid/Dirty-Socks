<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dungeon Loot – Dirty Socks</title>
<meta name="description" content="Level 50+ dungeon boss drops in WoW Forever, sorted by dungeon and boss.">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="images/favicon.png" type="image/png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dirty Socks">
<meta property="og:title" content="Dungeon Loot – Dirty Socks">
<meta property="og:description" content="Level 50+ dungeon boss drops in WoW Forever, sorted by dungeon and boss.">
<meta property="og:url" content="https://ne0squid.github.io/Dirty-Socks/dungeon-loot.html">
<meta property="og:image" content="https://ne0squid.github.io/Dirty-Socks/images/og-image.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Dungeon Loot – Dirty Socks">
<meta name="twitter:description" content="Level 50+ dungeon boss drops in WoW Forever, sorted by dungeon and boss.">
<meta name="twitter:image" content="https://ne0squid.github.io/Dirty-Socks/images/og-image.jpg?v=2">
<script src="faction.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#f3ead7;--surface:#fffaf0;--text:#2a2118;--muted:#6b5b45;--accent:#a3171b;--accent-text:#fffaf0;--line:#d9c9a5;--hero:#e8d9b5;--blue:#2f6fa8;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--surface:#181b24;--text:#ece6d8;--muted:#9a9484;--accent:#e0483f;--accent-text:#14110a;--line:#2b2f3b;--hero:#1f1416;--blue:#6aa9e0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--surface:#181b24;--text:#ece6d8;--muted:#9a9484;--accent:#e0483f;--accent-text:#14110a;--line:#2b2f3b;--hero:#1f1416;--blue:#6aa9e0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6}
h1,h2,h3{font-family:Cinzel,Georgia,serif;margin:0}
a{color:var(--accent)}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.hero{background:var(--hero);border-bottom:1px solid var(--line)}
.banner{padding:0;line-height:0}
.banner img{display:block;width:100%;height:clamp(110px,30vw,480px);object-fit:cover;object-position:center 35%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
section{padding:44px 0}
h2{font-size:1.6rem;color:var(--accent);margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.muted{color:var(--muted);font-size:.9rem}
.btn{display:inline-block;background:var(--accent);color:var(--accent-text);padding:9px 18px;border-radius:6px;font-weight:600;text-decoration:none;font-size:.9rem;border:0;cursor:pointer;font-family:inherit}
#entries{display:grid;gap:14px;margin-top:18px}
.pn-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pn-badge{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.pn-hotfix{border-color:var(--accent);color:var(--accent)}
.pn-build{border-color:var(--blue);color:var(--blue)}
.pn-new{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.pn-date{margin-left:auto;color:var(--muted);font-size:.9rem}
.pn-title{font-size:1.15rem;margin:0 0 6px}
.pn-sum{margin:0 0 10px}
.pn-credit{margin-top:14px}
#more{margin:16px auto 0;display:block}
.embed-box{margin-top:18px}
.embed-box iframe{display:block;width:100%;height:80vh;min-height:500px;border:1px solid var(--line);border-radius:8px;margin-top:14px;background:#fff}
footer{text-align:center;padding:28px 20px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
</style>
<style>
.chips[hidden]{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:baseline;gap:8px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit;font-size:.88rem;font-weight:600}
.chip small{font-weight:400;color:var(--muted);font-size:.78rem}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px;align-items:center}
.tools input[type=search],.tools select{font:inherit;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
.tools input[type=search]{flex:1 1 240px;min-width:0}
.tools select{flex:0 0 auto;max-width:100%}
.tools input:focus-visible,.tools select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:8px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.tbtn:hover{color:var(--text);border-color:var(--muted)}
.dhead{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;justify-content:space-between;margin:24px 0 10px}
.dhead h3{font-size:1.5rem;color:var(--accent)}
details.boss{padding:0;margin-bottom:10px;overflow:hidden}
details.boss>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 16px;flex-wrap:wrap}
details.boss>summary::-webkit-details-marker{display:none}
details.boss>summary::before{content:"";width:0;height:0;border-left:6px solid var(--accent);border-top:5px solid transparent;border-bottom:5px solid transparent;flex:none;transition:transform .15s}
details.boss[open]>summary::before{transform:rotate(90deg)}
details.boss>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.bn{color:var(--muted);font-size:.85rem;min-width:1.6em}
.bt{font-weight:600}
.badge{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted)}
.badge.fin{color:var(--accent);border-color:var(--accent)}
.cnt{margin-left:auto;color:var(--muted);font-size:.85rem}
.tw{overflow-x:auto;border-top:1px solid var(--line)}
table.loot{width:100%;border-collapse:collapse;font-size:.92rem}
.loot th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:9px 16px;font-weight:600;border-bottom:1px solid var(--line)}
.loot td{padding:9px 16px;border-top:1px solid var(--line);vertical-align:top}
.loot tr:first-child td{border-top:0}
.loot .it{font-weight:600}.loot .mu{color:var(--muted)}
.res{margin-top:22px}
.empty{color:var(--muted);padding:18px 4px}
@media (max-width:640px){.loot th:nth-child(3),.loot td:nth-child(3){display:none}details.boss>summary{padding:12px}.loot td,.loot th{padding:8px 12px}}
</style>
</head>
<body>
<nav></nav>
<script src="nav.js"></script>

<header class="hero banner">
  <h1 class="sr">Dirty Socks</h1>
  <a href="index.html"><img src="images/Raid-Horde.png" alt="Dirty Socks – back to the guild page"><script>window.dsBanner&&dsBanner()</script></a>
</header>

<main class="wrap">
<section>
  <h2>End-Game Dungeon Loot</h2>
  <p class="muted" style="margin:-6px 0 18px">What drops from every boss in the level 50+ dungeons, in the order you meet them. Loot is still being discovered, so some lists may be incomplete.</p>
  <div class="chips" id="dungeons" role="group" aria-label="Dungeon"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Search for an item or boss in every dungeon…" aria-label="Search items and bosses">
    <select id="slot" aria-label="Filter by slot"><option value="">All slots</option></select>
    <button type="button" class="tbtn" id="toggle">Expand all</button>
  </div>
  <div id="view" aria-live="polite"></div>
  <details class="card" style="margin-top:22px"><summary style="cursor:pointer;font-weight:600">About this data</summary><ul id="notes" class="muted" style="margin:12px 0 0;padding-left:20px"></ul></details>
</section>
</main>

<footer>© <span id="yr"></span> Dirty Socks · Not affiliated with Blizzard Entertainment.</footer>

<script>
document.getElementById("yr").textContent=new Date().getFullYear();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
let D=[],TRASH={},cur=null,allOpen=false;
const $=id=>document.getElementById(id);
const qv=()=>$("q").value.trim().toLowerCase(),sv=()=>$("slot").value;
const slotOk=i=>!sv()||i.slot===sv();
const chance=i=>i.chance||"";
function rows(items){
  const showC=items.some(i=>i.chance);
  return `<div class="tw"><table class="loot"><thead><tr><th>Item</th><th>Slot</th><th>Type</th>${showC?"<th>Drop chance</th>":""}</tr></thead><tbody>${items.map(i=>`<tr><td class="it">${esc(i.item)}</td><td class="${i.slot==="Not yet discovered"?"mu":""}">${esc(i.slot==="Not yet discovered"?"Slot unknown":i.slot||"")}</td><td class="mu">${esc(i.kind||"")}</td>${showC?`<td class="mu">${esc(chance(i))}</td>`:""}</tr>`).join("")}</tbody></table></div>`;
}
const badge=t=>t==="Boss"?"":`<span class="badge${t==="Final boss"?" fin":""}">${esc(t.replace(/^Boss \((.*)\)$/,"$1"))}</span>`;
function pick(id,fromHash){
  cur=D.find(d=>slug(d.name)===id)||D[0];
  if(!fromHash){try{history.replaceState(null,"","#"+slug(cur.name))}catch(_){}}
  $("dungeons").innerHTML=D.map(d=>`<button type="button" class="chip" aria-pressed="${d===cur}" data-id="${slug(d.name)}">${esc(d.name)} <small>${esc(d.levels)}</small></button>`).join("");
  draw();
}
function draw(){
  const q=qv(),view=$("view");
  $("dungeons").hidden=!!q;
  if(q){ // search every dungeon
    const hits=[];
    D.forEach(d=>{
      d.bosses.forEach(b=>b.items.forEach(i=>{if(slotOk(i)&&(i.item.toLowerCase().includes(q)||b.name.toLowerCase().includes(q)))hits.push({i,src:b.name,d:d.name})}));
      (TRASH[d.trashGroup]||[]).forEach(i=>{if(d===D.find(x=>x.trashGroup===d.trashGroup)&&slotOk(i)&&i.item.toLowerCase().includes(q))hits.push({i,src:"Trash",d:d.trashGroup})});
    });
    view.innerHTML=`<div class="dhead res"><h3>Search results</h3><span class="muted">${hits.length} ${hits.length===1?"item":"items"}</span></div>`+(hits.length?`<div class="card" style="padding:0"><div class="tw" style="border:0"><table class="loot"><thead><tr><th>Item</th><th>Slot</th><th>Type</th><th>Dropped by</th></tr></thead><tbody>${hits.map(h=>`<tr><td class="it">${esc(h.i.item)}</td><td>${esc(h.i.slot==="Not yet discovered"?"Slot unknown":h.i.slot||"")}</td><td class="mu">${esc(h.i.kind||"")}</td><td>${esc(h.src)} <span class="mu">· ${esc(h.d)}</span></td></tr>`).join("")}</tbody></table></div></div>`:'<p class="empty">Nothing matches that search.</p>');
    $("toggle").hidden=true;return;
  }
  $("toggle").hidden=false;
  const bosses=cur.bosses.map(b=>({b,items:b.items.filter(slotOk)})).filter(x=>x.items.length);
  const trash=(TRASH[cur.trashGroup]||[]).filter(slotOk);
  const drops=bosses.reduce((n,x)=>n+x.items.length,0);
  view.innerHTML=`<div class="dhead"><h3>${esc(cur.name)}</h3><span class="muted">Level ${esc(cur.levels)} · ${cur.bosses.length} bosses · ${drops} ${sv()?esc(sv().toLowerCase())+" ":""}drops</span></div>`
  +(bosses.length?bosses.map(({b,items})=>`<details class="card boss"${allOpen?" open":""}><summary><span class="bn">${b.n}</span><span class="bt">${esc(b.name)}</span>${badge(b.type)}<span class="cnt">${items.length} ${items.length===1?"item":"items"}</span></summary>${rows(items)}</details>`).join(""):`<p class="empty">No ${esc(sv().toLowerCase())} drops from bosses in this dungeon.</p>`)
  +(trash.length?`<details class="card boss"${allOpen?" open":""}><summary><span class="bn"></span><span class="bt">Trash drops</span><span class="badge">Not tied to a boss</span><span class="cnt">${trash.length} items</span></summary>${cur.trashGroup!==cur.name?`<p class="muted" style="margin:0;padding:10px 16px;border-top:1px solid var(--line)">Shared across ${esc(cur.trashGroup)}.</p>`:""}${rows(trash)}</details>`:"");
  $("toggle").textContent=allOpen?"Collapse all":"Expand all";
}
$("dungeons").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)pick(b.dataset.id)});
$("q").addEventListener("input",draw);$("slot").addEventListener("change",draw);
$("toggle").addEventListener("click",()=>{allOpen=!allOpen;document.querySelectorAll("#view details.boss").forEach(d=>d.open=allOpen);$("toggle").textContent=allOpen?"Collapse all":"Expand all"});
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(D.some(d=>slug(d.name)===id))pick(id,true)});
fetch("dungeon-loot.json").then(r=>r.json()).then(j=>{
  const lv=s=>parseInt(s,10)||0;
  D=j.dungeons.slice().sort((a,b)=>lv(a.levels)-lv(b.levels)||a.name.localeCompare(b.name));TRASH=j.trash;
  const slots=[...new Set(D.flatMap(d=>d.bosses.flatMap(b=>b.items.map(i=>i.slot))).concat(Object.values(TRASH).flat().map(i=>i.slot)))].filter(s=>s&&s!=="Not yet discovered").sort();
  $("slot").innerHTML='<option value="">All slots</option>'+slots.map(s=>`<option>${esc(s)}</option>`).join("");
  $("notes").innerHTML=j.notes.map(n=>`<li>${esc(n)}</li>`).join("");
  const h=location.hash.slice(1);pick(D.some(d=>slug(d.name)===h)?h:slug(D[0].name),true);
}).catch(()=>{$("view").innerHTML='<p class="muted">Could not load the loot tables. Try refreshing the page.</p>'});
</script>
</body>
</html>
