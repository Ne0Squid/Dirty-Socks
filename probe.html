<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Data – Dirty Socks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#f3ead7;--surface:#fffaf0;--text:#2a2118;--muted:#6b5b45;--accent:#a3171b;--line:#d9c9a5;--ok:#2e7d32;--bad:#a3171b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--surface:#181b24;--text:#ece6d8;--muted:#9a9484;--accent:#e0483f;--line:#2b2f3b;--ok:#6fcf74;--bad:#e0483f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6}
h1,h2,h3{font-family:Cinzel,Georgia,serif;margin:0}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 60px}
nav{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
nav a{text-decoration:none;font-weight:600;font-size:.9rem;color:var(--muted)}nav a:hover,nav a.here{color:var(--accent)}
h1{font-size:1.8rem;color:var(--accent);margin:32px 0 6px}
.muted{color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-top:12px}
summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.st{font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.st.ok{color:var(--ok)}.st.no{color:var(--bad)}
code{font-size:.9rem}
pre{overflow:auto;max-height:420px;font-size:.78rem;line-height:1.45;margin:10px 0 0;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);white-space:pre-wrap;word-break:break-word}
h2{font-size:1.15rem;margin-top:28px}
</style>
</head>
<body>
<nav><a href="index.html">← Guild Home</a><a class="here" href="probe.html">Test Data</a></nav>
<div class="wrap">
  <h1>Test Data</h1>
  <p class="muted" id="meta">Loading…</p>
  <div id="out"></div>
</div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
fetch("probe-data.json",{cache:"no-cache"}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{
  const ok=d.results.filter(r=>r.status===200).length;
  document.getElementById("meta").textContent=`Raw Blizzard responses for dungeon and raid endpoints, sampled from the top-level characters (${d.characters.join(", ")}). ${ok} of ${d.results.length} answered. Updated ${new Date(d.generated).toLocaleString()}.`;
  const by={};d.results.forEach(r=>(by[r.character]=by[r.character]||[]).push(r));
  document.getElementById("out").innerHTML=Object.entries(by).map(([who,rows])=>`<h2>${esc(who)}</h2>`+rows.map(r=>`<details class="card"><summary><span class="st ${r.status===200?"ok":"no"}">${r.status||"error"}</span><code>${esc(r.path)}</code></summary>${r.body!=null?`<pre>${esc(JSON.stringify(r.body,null,2))}</pre>`:'<p class="muted">No data returned.</p>'}</details>`).join("")).join("");
}).catch(()=>{document.getElementById("meta").textContent="No test data yet. Run Update guild data from the Actions tab, then refresh."});
</script>
</body>
</html>
