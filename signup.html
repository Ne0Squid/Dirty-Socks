<style>
:root{--bg:#f3ead7;--surface:#fffaf0;--text:#2a2118;--muted:#6b5b45;--accent:#a3171b;--accent-text:#fffaf0;--line:#d9c9a5;--hero:#e8d9b5;--blue:#2f6fa8;color-scheme:light;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d11;--surface:#10151c;--text:#ece6d8;--muted:#9a9484;--accent:#db433b;--accent-text:#0b0807;--line:#232732;--hero:#191011;--blue:#6aa9e0;color-scheme:dark}}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tag{margin-left:auto;font-size:.75rem;color:var(--muted);text-align:right;white-space:nowrap}

footer{padding:0 max(20px,calc((100% - 1200px)/2));color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
footer a{color:var(--accent);text-decoration:none;font-weight:600}footer a:hover{text-decoration:underline}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px 40px;padding:36px 0 30px}
.fcol h3{font-family:Cinzel,Georgia,serif;font-size:.95rem;letter-spacing:.06em;color:var(--text);margin:0 0 12px}
.fcol ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fcol li a{color:var(--muted);font-weight:400;font-size:.92rem}.fcol li a:hover{color:var(--accent);text-decoration:none}
.fbrandlink{display:inline-flex;align-items:center;gap:12px;color:var(--accent);font-family:Cinzel,Georgia,serif;font-weight:800;font-size:1.25rem;letter-spacing:.03em}.fbrandlink:hover{text-decoration:none}
.fbrandlink img{height:54px;width:auto;display:block}

html:root:not([data-faction="alliance"]) .fbrandlink .fl-alliance,html:root[data-faction="alliance"] .fbrandlink .fl-horde{display:none}
.fbase{display:flex;justify-content:space-between;align-items:center;gap:8px 28px;flex-wrap:wrap;padding:18px 0 24px;border-top:1px solid var(--line)}

h3.sec{font-size:1.15rem;margin:26px 0 12px}

.ch b{display:flex;align-items:center;gap:8px}

.chip.ok{color:#5fd38d;border-color:#5fd38d55}.chip.warn{color:#e0b341;border-color:#e0b34155}

.lu{list-style:none;margin:10px 0 0;padding:0}

.lu .nm{font-weight:600}.lu .nm a{color:inherit;text-decoration:none}.lu .nm a:hover{color:var(--accent);text-decoration:underline}
.st{font-size:.74rem;font-weight:600;border-radius:999px;padding:1px 9px;border:1px solid var(--line);text-transform:capitalize}

.mini{font:inherit;font-size:.78rem;padding:2px 9px;border-radius:6px;border:1px solid var(--line);background:none;color:var(--text);cursor:pointer}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.slotsel{font:inherit;font-size:.78rem;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);max-width:11.5rem}

    <div class="fcol"><h3>Navigation</h3><ul><li><a href="/">Home</a></li><li><a href="/roster">Roster</a></li><li><a href="/hall-of-fame">Hall of Fame</a></li><li><a href="/recruitment">Recruitment</a></li></ul></div>

<script src="auth-config.js"></script>
<script>
document.getElementById("yr").textContent=new Date().getFullYear();
(function(){
const Q=new URLSearchParams(location.search);
const API=((location.hostname==="localhost"&&Q.get("api"))||window.DS_API||"").replace(/\/+$/,"");
const DEMO=!API||Q.has("demo");
const SKEY="ds-session";
const RAIDS={barrow:"The Barrow Deeps (10)",hyjal:"Hyjal Summit (20)",both:"Both raids"};
const SHORT={barrow:"Barrow",hyjal:"Hyjal"};
// "Both raids" is really two requests: each raid has its own status (approve Barrow, decline Hyjal, ...)
const raidList=r=>r==="both"?["barrow","hyjal"]:[r];
const stOf=(s,raid)=>(s.statuses&&s.statuses[raid])||s.status||"pending";
// Roster slots an officer can give an approved player. Backups are one shared pool, tagged with the role they cover.
const SLOT_LABEL={main:"Main Tank",off:"Off Tank",heal:"Healer",dps:"DPS","bak-tank":"Backup · Tank","bak-heal":"Backup · Healer","bak-dps":"Backup · DPS"};
const SLOT_IDS=Object.keys(SLOT_LABEL);
const bucket=v=>v.startsWith("bak")?"bak":v;
const slotOf=(s,raid)=>(s.slots&&s.slots[raid])||"";
const NIGHTS={wednesday:"Wednesday (8PM-12AM EST)",thursday:"Thursday (8PM-12AM EST)"};
const view=document.getElementById("view");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const full=m=>m.surname?m.name+" "+m.surname:m.name, key=s=>String(s).toLowerCase().replace(/\s+/g," ");
// Names in the sign-up lists open that character's page when the guild roster knows them (level 10 and up).
const charLink=c=>{const m=S.byName[key(c)];return m&&m.level>=10?`<a href="/character?c=${encodeURIComponent((m.name+"-"+(m.surname||"")).toLowerCase().replace(/['’]/g,"").replace(/\s+/g,"-"))}">${esc(c)}</a>`:esc(c)};
const S={token:null,demoIn:false,me:null,roster:[],byName:{},overrides:{},signups:[],caps:{barrow:10,hyjal:20},layout:{barrow:{main:1,off:1,heal:2,dps:6,bak:2},hyjal:{main:1,off:1,heal:4,dps:14,bak:4}},pick:null,form:null,notice:"",msg:"",bad:false,busy:false,loadErr:""};
try{S.token=localStorage.getItem(SKEY)}catch(_){}

// ---- coming back from Battle.net -------------------------------------------------------------
(function(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("session")){S.token=h.get("session");try{localStorage.setItem(SKEY,S.token)}catch(_){}}
  const e=h.get("error");
  if(e)S.notice=/denied|cancel/i.test(e)?"Sign-in was cancelled. You can try again whenever you like.":"Battle.net sign-in did not complete. Please try again.";
  if(location.hash)history.replaceState(null,"",location.pathname+location.search);
})();

// ---- API: the real one, and a pretend one for demo mode --------------------------------------
async function call(path,opt){
  const r=await fetch(API+path,{...opt,headers:{Authorization:"Bearer "+S.token,"Content-Type":"application/json"}});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){signOut();S.notice="Your session ended. Please sign in again.";throw new Error("auth")}
  if(!r.ok)throw new Error(j.error||"Something went wrong. Please try again.");
  return j;
}
const real={
  me:()=>call("/api/me"),list:()=>call("/api/signups"),
  put:b=>call("/api/signup",{method:"PUT",body:JSON.stringify(b)}),
  del:(c,sub,raid)=>call("/api/signup?character="+encodeURIComponent(c)+(sub?"&sub="+encodeURIComponent(sub):"")+(raid?"&raid="+encodeURIComponent(raid):""),{method:"DELETE"}),
  status:b=>call("/api/signup/status",{method:"POST",body:JSON.stringify(b)}),
  slot:b=>call("/api/signup/slot",{method:"POST",body:JSON.stringify(b)})
};
let demoRows=null;
function demoSeed(){
  const top=S.roster.filter(m=>m.level>=10).sort((a,b)=>b.level-a.level);
  const others=top.slice(3,9);
  demoRows=others.map((m,i)=>({character:full(m),raid:i%3===2?"both":i%2?"hyjal":"barrow",roles:[roleOf(m)],nights:["wednesday","thursday"],statuses:Object.fromEntries(raidList(i%3===2?"both":i%2?"hyjal":"barrow").map(r=>[r,i<3&&r!=="hyjal"||i===1?"approved":"pending"])),slots:{},verified:true,mine:false,sub:"d"+i,battletag:"Player"+i+"#"+(1000+i),updated:i}));
}
const demo={
  async me(){
    const top=S.roster.filter(m=>m.level>=10).sort((a,b)=>b.level-a.level).slice(0,3);
    return{sub:"demo",battletag:"YourName#1234",officer:Q.get("demo")==="officer",source:"blizzard",charsStatus:200,
      characters:top.map(m=>({name:m.name,surname:m.surname,level:m.level,cls:m.cls}))};
  },
  async list(){if(!demoRows)demoSeed();return{signups:demoRows.map(r=>({...r,slots:{...r.slots}})),caps:{barrow:10,hyjal:20},layout:S.layout}},
  async put(b){
    if(!demoRows)demoSeed();
    const i=demoRows.findIndex(r=>r.mine&&key(r.character)===key(b.character));
    const row={...b,statuses:Object.fromEntries(raidList(b.raid).map(r=>[r,"pending"])),slots:{},verified:true,mine:true,sub:"demo",battletag:"YourName#1234",updated:Date.now()};
    if(i<0)demoRows.push(row);else demoRows[i]=row;return{ok:true};
  },
  async del(c,sub,raid){
    if(!demoRows)demoSeed();
    const r=demoRows.find(r=>key(r.character)===key(c)&&(sub?r.sub===sub:r.mine));if(!r)return{ok:true};
    if(raid&&r.raid==="both"){r.raid=raid==="barrow"?"hyjal":"barrow";delete r.statuses[raid];delete r.slots[raid];return{ok:true}}
    demoRows=demoRows.filter(x=>x!==r);return{ok:true};
  },
  async status(b){const r=demoRows.find(r=>r.sub===b.sub&&key(r.character)===key(b.character));if(r)for(const x of(b.raid?[b.raid]:raidList(r.raid))){r.statuses[x]=b.status;if(b.status!=="approved")delete r.slots[x]}return{ok:true}},
  async slot(b){const r=demoRows.find(r=>r.sub===b.sub&&key(r.character)===key(b.character));if(!r)return{ok:true};
    if(b.slot){r.statuses[b.raid]="approved";r.slots[b.raid]=b.slot}else delete r.slots[b.raid];return{ok:true}}
};
const api=DEMO?demo:real;

// ---- character helpers -----------------------------------------------------------------------
function roleOf(m){
  const o=S.overrides[full(m)];if(o)return o==="Healer"?"Healer":o==="Tank"?"Tank":"DPS";
  const sp=m.spec||"";
  if(/Protection|Guardian|Blood/.test(sp))return"Tank";
  if(/Holy|Restoration|Discipline|Mistweaver|Preservation/.test(sp))return"Healer";
  return"DPS";
}
const roleClass={Tank:"tank",Healer:"heal",DPS:"dps"};
const roleChip=r=>`<span class="role ${roleClass[r]||""}">${esc(r)}</span>`;
const info=c=>S.byName[key(full(c))]||null;
function profChips(m){return(m&&m.professions||[]).filter(p=>p.primary).map(p=>`<span class="chip">${esc(p.name)} ${p.skill}</span>`).join("")}

// ---- views -----------------------------------------------------------------------------------
function signedOut(){
  return`<div class="card">
    <h3 style="font-family:Cinzel,Georgia,serif;margin:0 0 6px">Sign up for raids with Battle.net</h3>
    <p class="muted" style="margin:0">Skip the form. Sign in and your characters, levels and gear come with you.</p>
    <ol class="steps"><li>Sign in with your Battle.net account.</li><li>Pick the character you want to bring.</li><li>Choose a raid and your nights. The officers confirm your spot.</li></ol>
    <button class="btn bnet" id="signin" type="button">Sign in with Battle.net</button>
    <p class="muted" style="margin:14px 0 0">We only read your BattleTag and your character list. We never see your password and cannot play, buy or change anything on your account. Prefer not to sign in? <a href="https://forms.gle/wESFMshow64SfqLF6" target="_blank" rel="noopener">Use the Google request form</a>.</p>
  </div>`;
}
function charCards(){
  const list=S.me.characters.slice().sort((a,b)=>(b.level||0)-(a.level||0));
  return`<div class="chars" role="radiogroup" aria-label="Your characters">`+list.map(c=>{
    const m=info(c),n=full(c),sel=S.pick&&key(S.pick)===key(n);
    const lvl=m?m.level:c.level, cls=m?m.cls:c.cls;
    return`<label class="ch"><input type="radio" name="pick" value="${esc(n)}"${sel?" checked":""}><div class="card">
      <b><span class="dot" style="background:${esc(m&&m.color||"var(--muted)")}"></span>${esc(n)}</b>
      <small>Level ${esc(lvl)} ${esc((m&&m.spec?m.spec+" ":"")+(cls||""))}</small>
      <div class="chips">${m?'<span class="chip ok">In Dirty Socks</span>':'<span class="chip warn">Not in the guild yet</span>'}${profChips(m)}</div>
    </div></label>`}).join("")+`</div>`;
}
function claimPicker(){
  const list=S.roster.filter(m=>m.level>=10).sort((a,b)=>full(a).localeCompare(full(b)));
  return`<div class="card rq"><p class="muted" style="margin:0 0 12px">Battle.net did not share your character list for this game, so choose your character from the guild roster. The officers double-check every sign-up.</p>
    <label for="claim">Character<select id="claim"><option value="">Choose your character</option>${list.map(m=>`<option value="${esc(full(m))}"${S.pick&&key(S.pick)===key(full(m))?" selected":""}>${esc(full(m))} · ${esc(m.cls)}</option>`).join("")}</select></label></div>`;
}
function formView(){
  const m=S.byName[key(S.pick)],f=S.form,mine=S.signups.find(s=>s.mine&&key(s.character)===key(S.pick));
  const stats=m?`<div class="stats"><span>Level <b>${m.level}</b></span><span><b>${esc((m.spec?m.spec+" ":"")+m.cls)}</b></span>${profChips(m)?'<span style="display:flex;gap:6px">'+profChips(m)+"</span>":""}</div>`
    :`<div class="stats"><span>This character is not on the Dirty Socks roster yet. The officers will see that on your sign-up.</span></div>`;
  return`<form class="card rq" id="suform" novalidate>
    <h3 style="font-family:Cinzel,Georgia,serif;margin:0 0 4px">${esc(S.pick)}</h3>${stats}
    <div class="rq-grid">
      <label for="su-raid">Raid<select id="su-raid">${Object.entries(RAIDS).map(([k,v])=>`<option value="${k}"${f.raid===k?" selected":""}>${esc(v)}</option>`).join("")}</select></label>
      <fieldset><legend>Roles you can fill</legend>${["Tank","Healer","DPS"].map(r=>`<label class="chk"><input type="checkbox" name="su-role" value="${r}"${f.roles.includes(r)?" checked":""}> ${r}</label>`).join("")}</fieldset>
      <fieldset><legend>Nights you can make</legend>${Object.entries(NIGHTS).map(([k,v])=>`<label class="chk"><input type="checkbox" name="su-night" value="${k}"${f.nights.includes(k)?" checked":""}> ${esc(v.split(" ")[0])}</label>`).join("")}</fieldset>
    </div>
    <label for="su-note" style="margin-top:14px"><span>Anything else to tell us? <span class="muted" style="font-weight:400">(optional)</span></span><textarea id="su-note" rows="3" maxlength="300" placeholder="Off-spec, gear status, a backup character…">${esc(f.note)}</textarea></label>
    <div class="rq-actions"><button class="btn" type="submit"${S.busy?" disabled":""}>${mine?"Update sign-up":"Sign up"}</button><span class="muted${S.bad?" err":""}" id="su-msg" role="status">${esc(S.msg)}</span></div>
  </form>`;
}
function mySignups(){
  const mine=S.signups.filter(s=>s.mine);
  if(!mine.length)return"";
  return`<h3 class="sec">Your sign-ups</h3><div class="card"><ul class="lu">`+mine.map(s=>`<li><span class="nm">${charLink(s.character)}</span>${s.roles.map(roleChip).join("")}<span class="muted">${esc(RAIDS[s.raid])} · ${s.nights.map(n=>esc(NIGHTS[n].split(" ")[0])).join(" & ")}</span>${raidList(s.raid).map(r=>`<span class="st ${stOf(s,r)}">${s.raid==="both"?SHORT[r]+" · ":""}${stOf(s,r)}</span>${slotOf(s,r)?`<span class="chip ok" title="Your place in the ${esc(SHORT[r])} roster">${esc(SLOT_LABEL[slotOf(s,r)])}</span>`:""}`).join("")}<span class="sp"><button class="mini" data-edit="${esc(s.character)}" type="button">Edit</button>${s.raid==="both"?raidList(s.raid).map(r=>`<button class="mini" data-del="${esc(s.character)}" data-raid="${r}" type="button" title="Drop out of ${esc(SHORT[r])} only. You stay signed up for ${esc(SHORT[r==="barrow"?"hyjal":"barrow"])}.">Leave ${esc(SHORT[r])}</button>`).join(""):""}<button class="mini" data-del="${esc(s.character)}" type="button"${s.raid==="both"?' title="Withdraw from both raids"':""}>${s.raid==="both"?"Withdraw all":"Withdraw"}</button></span></li>`).join("")+`</ul></div>`;
}
function slotPicker(s,raid){
  const cur=slotOf(s,raid),lay=S.layout[raid]||{},used={};
  S.signups.forEach(o=>{if(o===s)return;const v=slotOf(o,raid);if(v)used[bucket(v)]=(used[bucket(v)]||0)+1});
  const ok=stOf(s,raid)==="approved";
  return`<select class="slotsel${ok&&!cur?" need":""}" data-slot="1" data-c="${esc(s.character)}" data-sub="${esc(s.sub)}" data-raid="${raid}" aria-label="Roster slot for ${esc(s.character)}" title="Choose where ${esc(s.character)} sits in the ${esc(SHORT[raid])} roster. Picking a slot also approves them.">
    <option value="">${ok?"Choose slot…":"Place in roster…"}</option>`+SLOT_IDS.map(v=>{
      const b=bucket(v),n=used[b]||0,cap=lay[b]||0,full=n>=cap&&cur!==v,shown=n+(cur&&bucket(cur)===b?1:0);
      return`<option value="${v}"${cur===v?" selected":""}${full?" disabled":""}>${esc(SLOT_LABEL[v])} (${shown}/${cap})</option>`}).join("")+`</select>`;
}
function lineup(){
  const col=raid=>{
    const rows=S.signups.filter(s=>s.raid===raid||s.raid==="both"),cap=S.caps[raid];
    const ok=rows.filter(s=>stOf(s,raid)==="approved").length,wait=rows.filter(s=>stOf(s,raid)==="pending").length,need=rows.filter(s=>stOf(s,raid)==="approved"&&!slotOf(s,raid)).length;
    return`<div class="card"><h3>${esc(RAIDS[raid])}</h3><span class="muted">${ok} of ${cap} confirmed${wait?" · "+wait+" waiting":""}${S.me.officer&&need?" · "+need+" need a slot":""}</span>
      ${rows.length?`<ul class="lu">`+rows.filter(s=>stOf(s,raid)!=="declined"||S.me.officer).map(s=>`<li><span class="nm">${charLink(s.character)}</span>${s.roles.map(roleChip).join("")}<span class="st ${stOf(s,raid)}">${stOf(s,raid)}</span>${slotOf(s,raid)&&!S.me.officer?`<span class="chip ok">${esc(SLOT_LABEL[slotOf(s,raid)])}</span>`:""}${s.raid==="both"?`<span class="muted" title="This player signed up for both raids. Each raid is approved on its own.">+ ${esc(SHORT[raid==="barrow"?"hyjal":"barrow"])}</span>`:""}${s.verified?"":'<span class="chip warn" title="Claimed from the roster, not confirmed by Battle.net">unverified</span>'}${S.me.officer?`<span class="sp">${slotPicker(s,raid)}<button class="mini" data-set="approved" data-raid="${raid}" data-c="${esc(s.character)}" data-sub="${esc(s.sub)}" type="button">Approve</button><button class="mini" data-set="declined" data-raid="${raid}" data-c="${esc(s.character)}" data-sub="${esc(s.sub)}" type="button">Decline</button><button class="mini" data-del="${esc(s.character)}" data-sub="${esc(s.sub)}" data-raid="${raid}" type="button"${s.raid==="both"?` title="Takes them out of ${esc(SHORT[raid])} only. They stay signed up for ${esc(SHORT[raid==="barrow"?"hyjal":"barrow"])}."`:""}>Remove</button></span>`:""}</li>`).join("")+`</ul>`:`<p class="muted" style="margin:10px 0 0">Nobody yet. Be the first!</p>`}</div>`;
  };
  return`<h3 class="sec">Raid line-up</h3><div class="lineup">${col("barrow")}${col("hyjal")}</div>`;
}
function render(){
  const out=[];
  if(S.notice)out.push(`<div class="card notice" role="alert">${esc(S.notice)}</div>`);
  if(DEMO)out.push(`<div class="card demo"><b>Demo mode.</b> <span class="muted">This is a preview with pretend data. Nothing is saved or sent.${S.demoIn?"":" Click the button below to walk through it."}</span></div>`);
  const signed=DEMO?S.demoIn:!!S.token;
  if(!signed)out.push(signedOut());
  else if(S.loadErr)out.push(`<div class="card notice">${esc(S.loadErr)} <button class="linkbtn" id="retry" type="button">Try again</button></div>`);
  else if(!S.me)out.push(`<p class="muted">Loading your characters…</p>`);
  else{
    out.push(`<div class="who"><span>Signed in as <b>${esc(S.me.battletag)}</b>${S.me.officer?' <span class="chip ok">Officer</span>':""} <span class="muted" title="Officers use this number to give someone officer access">· account ID ${esc(S.me.sub)}</span></span><button class="linkbtn" id="signout" type="button">Sign out</button></div>`);
    out.push(`<h3 class="sec" style="margin-top:0">Choose your character</h3>`);
    out.push(S.me.characters.length?charCards():claimPicker());
    if(S.pick){out.push(`<h3 class="sec">Sign up</h3>`);out.push(formView())}
    out.push(mySignups());out.push(lineup());
  }
  // keep keyboard focus and typed text when the page redraws
  const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;
  view.innerHTML=out.join("");
  if(id){const el=document.getElementById(id);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(_){}}}
}

// ---- actions ---------------------------------------------------------------------------------
function pickChar(name){
  S.pick=name||null;S.msg="";
  if(!name){S.form=null;return}
  const m=S.byName[key(name)],ex=S.signups.find(s=>s.mine&&key(s.character)===key(name));
  S.form=ex?{raid:ex.raid,roles:ex.roles.slice(),nights:ex.nights.slice(),note:ex.note||""}
    :{raid:"barrow",roles:[m?roleOf(m):"DPS"],nights:["wednesday","thursday"],note:""};
}
async function refresh(){
  try{const l=await api.list();S.signups=l.signups;S.caps=l.caps||S.caps;S.layout=l.layout||S.layout}catch(e){if(e.message!=="auth")S.loadErr=e.message}
}
async function boot(){
  try{
    const[g,a]=await Promise.all([fetch("guild-data.json").then(r=>r.json()).catch(()=>({})),fetch("accounts.json").then(r=>r.json()).catch(()=>({}))]);
    S.roster=g.roster||[];S.overrides=a.roleOverrides||{};
    S.byName={};S.roster.forEach(m=>S.byName[key(full(m))]=m);
  }catch(_){}
  const signed=DEMO?S.demoIn:!!S.token;
  if(signed){
    S.loadErr="";
    try{S.me=await api.me();await refresh();if(S.me.characters.length===1&&!S.pick)pickChar(full(S.me.characters[0]))}
    catch(e){if(e.message!=="auth")S.loadErr=e.message}
  }
  render();
}
function signOut(){S.token=null;S.me=null;S.demoIn=false;S.pick=null;S.form=null;S.signups=[];try{localStorage.removeItem(SKEY)}catch(_){}window.dispatchEvent(new Event("ds-auth"))}
function readForm(){
  const f=document.getElementById("suform");if(!f)return;
  S.form={raid:f.querySelector("#su-raid").value,roles:[...f.querySelectorAll("[name=su-role]:checked")].map(x=>x.value),nights:[...f.querySelectorAll("[name=su-night]:checked")].map(x=>x.value),note:f.querySelector("#su-note").value};
}
view.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.id==="signin"){
    if(DEMO){S.demoIn=true;S.notice="";await boot();return}
    location.href=API+"/auth/login?return="+encodeURIComponent(location.origin+location.pathname+(location.hostname==="localhost"&&Q.get("api")?"?api="+Q.get("api"):""));return;
  }
  if(t.id==="signout"){signOut();S.notice="";render();return}
  if(t.id==="retry"){await boot();return}
  try{
    if(t.dataset.edit){pickChar(t.dataset.edit);render();document.getElementById("suform").scrollIntoView({behavior:"smooth",block:"center"});return}
    if(t.dataset.del){
      await api.del(t.dataset.del,t.dataset.sub&&t.dataset.sub!==S.me.sub?t.dataset.sub:undefined,t.dataset.raid||undefined);await refresh();
      if(S.pick&&key(S.pick)===key(t.dataset.del)){pickChar(S.pick)}
      S.msg="";render();return
    }
    if(t.dataset.set){await api.status({sub:t.dataset.sub,character:t.dataset.c,raid:t.dataset.raid,status:t.dataset.set});await refresh();render()}
  }catch(err){if(err.message!=="auth"){S.notice=err.message}render()}
});
view.addEventListener("change",async e=>{
  if(e.target.dataset&&e.target.dataset.slot){
    const t=e.target;t.disabled=true;
    try{await api.slot({sub:t.dataset.sub,character:t.dataset.c,raid:t.dataset.raid,slot:t.value});await refresh()}
    catch(err){if(err.message!=="auth")S.notice=err.message}
    render();return;
  }
  if(e.target.name==="pick"){readForm();pickChar(e.target.value);render();return}
  if(e.target.id==="claim"){pickChar(e.target.value);render();return}
  if(e.target.closest("#suform"))readForm();
});
view.addEventListener("input",e=>{if(e.target.id==="su-note")readForm()});
view.addEventListener("submit",async e=>{
  e.preventDefault();readForm();const f=S.form;
  const say=(t,bad)=>{S.msg=t;S.bad=!!bad;const el=document.getElementById("su-msg");if(el){el.textContent=t;el.className="muted"+(bad?" err":"")}};
  if(!f.roles.length)return say("Pick at least one role.",true);
  if(!f.nights.length)return say("Pick at least one night.",true);
  S.busy=true;say("Saving…");
  try{
    await api.put({character:S.pick,raid:f.raid,roles:f.roles,nights:f.nights,note:f.note.trim()});
    await refresh();S.busy=false;S.msg="Saved. The officers will confirm your spot.";S.bad=false;render();
  }catch(err){S.busy=false;if(err.message!=="auth")say(err.message,true);else render()}
});
boot();
})();
</script>
</body>
</html>
